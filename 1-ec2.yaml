- name: create ec2 and r53
  hosts: local
  connection: local
  vars:
    ami_id: ami-09c813fb71547fc4f
    sg_id:  sg-07ff3cc33c1e586ee # replace with your SG ID
    zone_id: "Z06749871383GP3VE90N7" # replace with your ID
    domain_name: "reddy3.fun"
    instance:
    - mongodb
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instance }}"
    register: ec2_output

  - name: print ec2 instance details
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
    