- name: setup catalogue server
  hosts: catalogue
  connection: local
  become: yes
  tasks:
  - name: disbale nodejs module
    ansible.builtin.command:
      cmd: "dnf module disable nodejs -y"
  - name: enable nodejs module
    ansible.builtin.command:
      cmd: "dnf module enable nodejs:20 -y"

  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: present
  - name: create roboshop user
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      home: /app
      comment: "roboshop system user"
      system: yes
  - name: create app directory
    ansible.builtin.file: 
      path: /app
      state: directory

  - name: download catalogue application
    ansible.builtin.get_url:
      url: "curl -o /tmp/catalogue.zip https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip "
      dest: /tmp/catalogue.zip
      remote_src: yes

  - name: unzip the catalogue application
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
 